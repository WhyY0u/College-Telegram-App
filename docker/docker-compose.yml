version: '3.8'

services:
  mysql:
    build:
      context: .
      dockerfile: mysql.dockerfile
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

  data-importer:
    build:
      context: .
      dockerfile: importer.dockerfile
    depends_on:
      mysql:
        condition: service_healthy
        
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    depends_on:
      data-importer:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  mysql_data:
